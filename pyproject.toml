[project]
name = "exodiscover"
version = "0.1.0"
description = "Leakage-free exoplanet classification over NASA Kepler, TESS, and K2 catalogs."
requires-python = ">=3.11,<3.13"
# Upper bounds are deliberate. With lower bounds alone, CI resolved a newer
# scikit-learn than any developer had installed, and its histogram binner began
# raising on an all-NaN column that 1.7 tolerated -- so the suite passed on
# every laptop and failed only on push, twice, on a defect no one could
# reproduce. Ceilings sit one minor above the last version actually tested;
# raise them deliberately and re-run, rather than discovering the bump in CI.
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.5,<1.8",
  "xgboost>=2.1,<4",
  "lightgbm>=4.5,<5",
  "catboost>=1.2,<2",
  "optuna>=4.0,<5",
  # shap is pre-1.0; its minor releases have changed the TreeExplainer return
  # shape before, which explain.py already normalises across two API eras.
  "shap>=0.46,<0.52",
  "matplotlib>=3.9,<4",
  "typer>=0.12,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "requests>=2.32,<3",
  "joblib>=1.4,<2",
]

[project.optional-dependencies]
# Serving the API. These were once installed ad-hoc by the Makefile and CI and
# so were the last unpinned dependencies in the project -- the same exposure
# that produced two unreproducible CI failures. Ceilings sit one major above
# what is tested. Pydantic is not listed here: request validation is not
# optional, so it is a core dependency above.
#
# gunicorn has no Windows port and is unused in development, where `make serve`
# runs `flask run`. It installs cleanly there regardless; the container is
# what needs it.
api = [
  "flask>=3.0,<4",
  "flask-cors>=4.0,<7",
  "gunicorn>=22.0,<24",
]
# ruff gains lint rules on minor bumps, which turns an unpinned ceiling into a
# CI failure on code that has not changed.
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5.0,<8",
  "ruff>=0.6,<0.17",
  "mypy>=1.11,<2",
]

[project.scripts]
exo = "exodiscover.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["ml"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["web", "backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]

[tool.ruff.lint.isort]
known-first-party = ["exodiscover"]

[tool.ruff.lint.per-file-ignores]
# Typer declares parameters as `x: T = Marker(...)` in the signature; B008
# flags the idiom itself, not a mistake. The API no longer needs this: Flask
# views take no injected defaults.
"ml/exodiscover/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
packages = ["exodiscover"]
mypy_path = "ml"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::UserWarning", "ignore::FutureWarning"]
